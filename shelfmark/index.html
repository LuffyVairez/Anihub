<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelfmark</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <header>
  <h1>Shelfmark</h1>
  <nav aria-label="Main">
    <button type="button" class="tab" id="tab-browse" aria-pressed="true">Browse</button>
    <button type="button" class="tab" id="tab-list" aria-pressed="false">My List <span id="list-count">0</span></button>
  </nav>
</header>

  <main>
    <form id="search-form">
        <div class="seg" role="group" aria-label="Catalogue">
  <button type="button" class="seg-btn" data-type="anime" aria-pressed="true">Anime</button>
  <button type="button" class="seg-btn" data-type="manga" aria-pressed="false">Manga</button>
</div>
      <label class="sr" for="q">Search titles</label>
      <input id="q" type="search" placeholder="e.g. Cowboy Bebop">
      <button type="submit">Search</button>
    </form>

    <h2 id="results-title">Top anime</h2>
        <div class="seg" id="list-filter" role="group" aria-label="Filter my list" hidden>
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-btn" data-filter="anime" aria-pressed="false">Anime</button>
      <button type="button" class="filter-btn" data-filter="manga" aria-pressed="false">Manga</button>
    </div>
  
    <p id="status"></p>
  <div id="results" class="grid"></div>
  </main>

  <footer>
    <p>Data from the Kitsu API.</p>
  </footer>
 <dialog id="detail" aria-labelledby="d-title">
     
   
<!-- <div id="local-player-wrap" style="margin-top: 15px;" hidden>
    <h4 style="margin: 5px 0; color: #66fcf1;">Local Video File Detected</h4>
    <video id="localVideoPlayer" controls style="width: 100%; border-radius: 6px; background: #000;"></video>
</div> -->

    <button type="button" class="close" id="d-close" aria-label="Close details">&times;</button>
    <div class="d-body">
        <div id="local-player-wrap" hidden>
  <video id="localVideoPlayer" controls preload="metadata"></video>
  <p id="player-note" class="meta" role="status"></p>
</div>
<input id="mp4-input" class="sr" type="file" accept="video/mp4,.mp4" tabindex="-1">
      <img id="d-img" alt="">
      <h3 id="d-title"></h3>
      <p id="d-meta" class="meta"></p>
      <p id="d-synopsis"></p>
            <p id="d-library" class="meta"></p>
  <label for="d-status">List status</label>
<select id="d-status">
  <option value="">Not on my list</option>
  <option value="planned">Planned</option>
  <option value="in-progress">In progress</option>
  <option value="finished">Finished</option>
</select>
<div id="d-links" class="links-row">
  <a id="d-anisnatch" class="watch-btn anisnatch-btn" href="#" target="_blank" rel="noopener" hidden>
    AniSnatch
  </a>
  <button type="button" id="d-play" class="watch-btn play-btn">
    Play MP4
  </button>
  <a id="d-anilist" class="watch-btn" href="#" target="_blank" rel="noopener" hidden>
    My Anilist
  </a>
</div>

  </dialog>

  <script src="script.js"></script>
  
  
</body>
</html>
